<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield - Stay Focused</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --slate-50: #f8fafc;
            --slate-400: #94a3b8;
            --slate-900: #0f172a;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--slate-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Premium Glass Container */
        .glass-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to bottom right, #fff 30%, var(--slate-400));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .message {
            font-size: 1.25rem;
            color: var(--slate-400);
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .quote-box {
            margin-top: 60px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--slate-400);
            position: relative;
            padding: 0 40px;
        }

        .footer-note {
            font-size: 0.9rem;
            color: var(--slate-400);
            margin-top: 30px;
            opacity: 0.7;
        }

        /* Pause Block Button */
        .pause-block-btn {
            position: fixed;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            background: rgba(244, 63, 94, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pause-block-btn:hover {
            background: rgba(244, 63, 94, 1);
            transform: translateX(-50%) translateY(-2px);
        }

        /* Pause Duration Section */
        .pause-duration-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-top: 30px;
            animation: fadeIn 0.4s ease-out;
        }

        .pause-duration-section h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .pause-message {
            font-size: 1rem;
            color: var(--slate-400);
            margin-bottom: 20px;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .duration-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--slate-50);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .duration-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .cancel-pause-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--slate-400);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-pause-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--slate-50);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            .glass-container {
                padding: 40px 20px;
                border-radius: 0;
            }

            h1 {
                font-size: 2.5rem;
            }

            .duration-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <div class="brand-badge">🛡️ TimeShield Protocol Active</div>
        <h1>Focus Restricted</h1>
        <p class="message" id="professionalMessage">This domain has been restricted to help you stay focused. Redirect
            your energy back to your core mission.</p>

        <div class="quote-box" id="motivationalQuote">
            "Your focus determines your reality." — Qui-Gon Jinn
        </div>

        <!-- Pause Duration Selection (Hidden by default) -->
        <div id="pauseDurationSection" class="pause-duration-section" style="display: none;">
            <h3>⏸️ Select Pause Duration</h3>
            <p class="pause-message">How long would you like to pause blocking?</p>
            <div class="duration-grid">
                <button class="duration-btn" data-minutes="5">5 minutes</button>
                <button class="duration-btn" data-minutes="15">15 minutes</button>
                <button class="duration-btn" data-minutes="30">30 minutes</button>
                <button class="duration-btn" data-minutes="60">1 hour</button>
                <button class="duration-btn" data-minutes="eod">Rest of Day</button>
            </div>
            <button class="cancel-pause-btn" id="cancelPauseBtn">Cancel</button>
        </div>
    </div>

    <!-- Pause Block Button -->
    <button class="pause-block-btn" id="pauseBlockBtn">
        ⏸️ Pause Blocks
    </button>

    <script src="pause-challenge.js"></script>
    <script src="focus-block.js"></script>
</body>

</html>
