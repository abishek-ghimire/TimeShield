<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield - Stay Focused</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --slate-50: #f8fafc;
            --slate-400: #94a3b8;
            --slate-900: #0f172a;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--slate-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Premium Glass Container */
        .glass-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to bottom right, #fff 30%, var(--slate-400));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .message {
            font-size: 1.25rem;
            color: var(--slate-400);
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .quote-box {
            margin-top: 60px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--slate-400);
            position: relative;
            padding: 0 40px;
        }

        .footer-note {
            font-size: 0.9rem;
            color: var(--slate-400);
            margin-top: 30px;
            opacity: 0.7;
        }

        /* Pause Block Button */
        .pause-block-btn {
            position: fixed;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            background: rgba(244, 63, 94, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pause-block-btn:hover {
            background: rgba(244, 63, 94, 1);
            transform: translateX(-50%) translateY(-2px);
        }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            .glass-container {
                padding: 40px 20px;
                border-radius: 0;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <div class="brand-badge">🛡️ TimeShield Protocol Active</div>
        <h1>Focus Restricted</h1>
        <p class="message" id="professionalMessage">This domain has been restricted to help you stay focused. Redirect
            your energy back to your core mission.</p>

        <div class="quote-box" id="motivationalQuote">
            "Your focus determines your reality." — Qui-Gon Jinn
        </div>
    </div>

    <!-- Pause Block Button -->
    <button class="pause-block-btn" id="pauseBlockBtn">
        ⏸️ Pause Protection
    </button>

    <script>
        class FocusBlockPage {
            constructor() {
                this.quotes = [
                    "Your focus determines your reality. — Qui-Gon Jinn",
                    "The successful warrior is the average man, with laser-like focus. — Bruce Lee",
                    "Deep work is the superpower of the 21st century. — Cal Newport",
                    "Focus is more important than intelligence. — Unknown",
                    "What you focus on expands. — Tony Robbins",
                    "Focus on being productive instead of busy. — Tim Ferriss",
                    "Discipline is the bridge between goals and accomplishment. — Jim Rohn",
                    "Starve your distractions, feed your focus. — Unknown",
                    "It is during our darkest moments that we must focus to see the light. — Aristotle",
                    "Success is the product of daily habits—not once-in-a-lifetime transformations. — James Clear",
                    "Concentrate all your thoughts upon the work at hand. The sun's rays do not burn until brought to a focus. — Alexander Graham Bell",
                    "The key to success is to focus on goals, not obstacles. — Unknown",
                    "Focus is a matter of deciding what things you're not going to do. — John Carmack",
                    "Lack of direction, not lack of time, is the problem. We all have twenty-four hour days. — Zig Ziglar",
                    "Successful people have focus. They don't get sidetracked by what's not important. — Unknown",
                    "Your life is controlled by what you focus on. — Tony Robbins",
                    "The secret of change is to focus all of your energy, not on fighting the old, but on building the new. — Socrates",
                    "Don't decrease the goal. Increase the effort. — Unknown",
                    "Focus like a laser, not a flashlight. — Unknown",
                    "Simplicity is the ultimate sophistication, and focus is the key to simplicity. — Unknown",
                    "Where focus goes, energy flows. — Tony Robbins",
                    "Great things are done by a series of small things brought together. — Vincent Van Gogh"
                ];
                this.init();
            }

            async init() {
                this.startQuoteRotation();
                this.addGoBackButton();
                this.addPauseBlockButton();
            }

            addGoBackButton() {
                const params = new URLSearchParams(window.location.search);
                const originalUrl = params.get('orig');
                
                if (originalUrl) {
                    const goBackBtn = document.createElement('a');
                    goBackBtn.href = '#';
                    goBackBtn.className = 'action';
                    goBackBtn.textContent = '← Go Back to Previous Page';
                    goBackBtn.style.marginTop = '20px';
                    goBackBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.location.href = decodeURIComponent(originalUrl);
                    });
                    
                    // Add to the container
                    const container = document.querySelector('.glass-container');
                    if (container) {
                        container.appendChild(goBackBtn);
                    }
                }
            }

            addPauseBlockButton() {
                const pauseBtn = document.getElementById('pauseBlockBtn');
                if (pauseBtn) {
                    pauseBtn.addEventListener('click', () => {
                        // Open pause overlay
                        window.open(chrome.runtime.getURL('floating/pause-overlay.html'), '_blank', 'width=600,height=700,scrollbars=no,resizable=no');
                    });
                }
            }

            startQuoteRotation() {
                const el = document.getElementById('motivationalQuote');
                // Initial jump to a random quote
                el.textContent = `"${this.quotes[Math.floor(Math.random() * this.quotes.length)]}"`;

                setInterval(() => {
                    el.style.opacity = 0;
                    setTimeout(() => {
                        el.textContent = `"${this.quotes[Math.floor(Math.random() * this.quotes.length)]}"`;
                        el.style.opacity = 0.6;
                    }, 500);
                }, 15000);
            }
        }

        new FocusBlockPage();
    </script>
</body>

</html>
