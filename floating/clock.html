<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ts-scale: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgba(10, 15, 30, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }

        .clock-face {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(4px * var(--ts-scale));
            padding: calc(10px * var(--ts-scale));
            width: 100%;
            height: 100%;
            text-align: center;
        }

        .time-display {
            font-family: 'Outfit', sans-serif;
            font-size: calc(clamp(28px, 10vw, 52px) * var(--ts-scale));
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: baseline;
        }

        .time-display .seconds-part {
            font-size: calc(0.5em * var(--ts-scale));
            color: rgba(148, 163, 184, 0.9);
            font-weight: 600;
            margin-left: calc(10px * var(--ts-scale));
        }

        .date-display {
            font-size: calc(clamp(12px, 3.5vw, 16px) * var(--ts-scale));
            color: rgba(248, 250, 252, 0.85);
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .timezone-display {
            font-size: calc(clamp(9px, 2.8vw, 12px) * var(--ts-scale));
            color: rgba(221, 221, 223, 0.851);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .focus-indicator {
            margin-top: calc(8px * var(--ts-scale));
            font-size: calc(clamp(11px, 3.2vw, 14px) * var(--ts-scale));
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(6px * var(--ts-scale));
        }

        .focus-indicator-line {
            color: #f43f5e;
            padding: calc(4px * var(--ts-scale)) calc(12px * var(--ts-scale));
            border-radius: 999px;
            background: rgba(244, 63, 94, 0.12);
            animation: focusPulse 2s infinite;
        }

        @keyframes focusPulse {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(244, 63, 94, 0.2);
            }

            50% {
                box-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
            }
        }

        #view-toggle {
            position: absolute;
            bottom: calc(10px * var(--ts-scale));
            right: calc(10px * var(--ts-scale));
            width: calc(32px * var(--ts-scale));
            height: calc(32px * var(--ts-scale));
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
        }

        #view-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        #view-toggle svg {
            width: calc(16px * var(--ts-scale));
            height: calc(16px * var(--ts-scale));
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="clock-face">
        <div class="time-display">
            <span id="hm">00:00</span><span class="seconds-part"><span id="sec">00</span></span>
        </div>
        <div class="date-display" id="dateDisplay"></div>
        <div class="timezone-display" id="tzDisplay"></div>
        <div class="focus-indicator" id="focusIndicator"></div>
    </div>

    <div id="view-toggle" title="Toggle Clock View">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2.1l4 4-4 4" />
            <path d="M3 12.6v-2.6a4 4 0 0 1 4-4h14" />
            <path d="M7 21.9l-4-4 4-4" />
            <path d="M21 11.4v2.6a4 4 0 0 1-4 4H3" />
        </svg>
    </div>

    <iframe id="flip-clock-frame" src="flip-clock.html"
        style="display: none; border: none; width: 100%; height: 100%;"></iframe>

    <script src="clock.js"></script>
</body>

</html>
