<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Clock</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
    <div class="floating-clock" id="floatingClock">
        <div class="clock-header">
            <button class="minimize-btn" title="Minimize">−</button>
            <button class="close-btn" title="Close">×</button>
        </div>
        
        <div class="clock-display">
            <div class="time" id="timeDisplay">00:00:00</div>
            <div class="date" id="dateDisplay">Monday, January 1</div>
            <div class="timezone" id="timezoneDisplay">NPT (UTC+5:45)</div>
                    </div>
                    <button id="addQuickTask" class="btn-add-task">+ Add</button>
                </div>
            </div>
        </div>
        
        <div class="clock-minimized" id="clockMinimized" style="display: none;">
            <div class="minimized-time" id="minimizedTime">00:00</div>
        </div>
    </div>
    
    <script src="clock.js"></script>
</body>
</html>
