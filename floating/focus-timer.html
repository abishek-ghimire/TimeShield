<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .focus-timer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 8px 16px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            cursor: move;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 200px;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .focus-timer.minimized {
            min-width: auto;
            padding: 6px 12px;
        }

        .timer-icon {
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer-text {
            flex: 1;
            text-align: center;
        }

        .timer-controls {
            display: flex;
            gap: 4px;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .timer-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-ring {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .minimized .timer-text,
        .minimized .timer-controls {
            display: none;
        }
    </style>
</head>
<body>
    <div class="focus-timer" id="focusTimer">
        <div class="timer-icon">⏰</div>
        <div class="timer-text" id="timerText">Focus: 25:00</div>
        <div class="timer-controls">
            <button class="timer-btn" id="minimizeBtn">−</button>
            <button class="timer-btn" id="closeBtn">×</button>
        </div>
    </div>

    <script src="focus-timer.js"></script>
</body>
</html>
