<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Limit Reached</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f43f5e;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.6;
        }

        .site-name {
            font-weight: bold;
            color: #f8fafc;
        }

        .action {
            margin-top: 40px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }

        .action:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Pause Block Button */
        .pause-block-btn {
            position: fixed;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            background: rgba(244, 63, 94, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pause-block-btn:hover {
            background: rgba(244, 63, 94, 1);
            transform: translateX(-50%) translateY(-2px);
        }

        /* Pause Duration Section */
        .pause-duration-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin: 30px auto;
            max-width: 500px;
            animation: fadeIn 0.4s ease-out;
        }

        .pause-duration-section h3 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f43f5e;
        }

        .pause-message {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .duration-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .duration-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #f43f5e;
            transform: translateY(-2px);
        }

        .cancel-pause-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-pause-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #f8fafc;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1>⌛ Time Limit Reached</h1>
    <p>You have reached your daily time allowance for <span id="siteName" class="site-name">this website</span>.</p>
    <p style="font-size: 1rem; margin-top: 10px;">Time to focus on something else!</p>
    <!-- href is set dynamically via chrome.runtime.getURL to avoid invalid placeholder URLs -->
    <a href="#" class="action" id="optionsLink">Review Screen Time</a>

    <!-- Pause Duration Selection (Hidden by default) -->
    <div id="pauseDurationSection" class="pause-duration-section" style="display: none;">
        <h3>⏸️ Select Pause Duration</h3>
        <p class="pause-message">How long would you like to pause blocking?</p>
        <div class="duration-grid">
            <button class="duration-btn" data-minutes="5">5 minutes</button>
            <button class="duration-btn" data-minutes="15">15 minutes</button>
            <button class="duration-btn" data-minutes="30">30 minutes</button>
            <button class="duration-btn" data-minutes="60">1 hour</button>
            <button class="duration-btn" data-minutes="eod">Rest of Day</button>
                <!-- Removed indefinite pause option to ensure blocking resumes automatically -->
        </div>
        <button class="cancel-pause-btn" id="cancelPauseBtn">Cancel</button>
    </div>

    <!-- Pause Block Button -->
    <button class="pause-block-btn" id="pauseBlockBtn">
        ⏸️ Pause Blocks
    </button>

        <script src="limit-block.js"></script>
</body>

</html>
