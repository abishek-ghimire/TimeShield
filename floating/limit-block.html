<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Limit Reached</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f43f5e;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.6;
        }

        .site-name {
            font-weight: bold;
            color: #f8fafc;
        }

        .action {
            margin-top: 40px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }

        .action:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Pause Block Button */
        .pause-block-btn {
            position: fixed;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            background: rgba(244, 63, 94, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pause-block-btn:hover {
            background: rgba(244, 63, 94, 1);
            transform: translateX(-50%) translateY(-2px);
        }
    </style>
</head>

<body>
    <h1>⌛ Time Limit Reached</h1>
    <p>You have reached your daily time allowance for <span id="siteName" class="site-name">this website</span>.</p>
    <p style="font-size: 1rem; margin-top: 10px;">Time to focus on something else!</p>
    <!-- href is set dynamically via chrome.runtime.getURL to avoid invalid placeholder URLs -->
    <a href="#" class="action" id="optionsLink">Review Screen Time</a>

    <!-- Pause Block Button -->
    <button class="pause-block-btn" id="pauseBlockBtn">
        ⏸️ Pause Protection
    </button>

    <script>
        // Add pause block functionality
        document.addEventListener('DOMContentLoaded', () => {
            const pauseBtn = document.getElementById('pauseBlockBtn');
            if (pauseBtn) {
                pauseBtn.addEventListener('click', () => {
                    // Open pause overlay
                    window.open(chrome.runtime.getURL('floating/pause-overlay.html'), '_blank', 'width=600,height=700,scrollbars=no,resizable=no');
                });
            }
        });
    </script>
    <script src="limit-block.js"></script>
</body>

</html>
