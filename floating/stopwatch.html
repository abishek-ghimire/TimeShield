<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="clock.css">
    <style>
        .stopwatch-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-width: 320px;
        }
        
        .stopwatch-display {
            font-size: 3rem;
            font-weight: 300;
            text-align: center;
            color: #333;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        
        .stopwatch-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-stopwatch {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .btn-start {
            background: #28a745;
            color: white;
        }
        
        .btn-pause {
            background: #ffc107;
            color: #333;
        }
        
        .btn-reset {
            background: #dc3545;
            color: white;
        }
        
        .btn-lap {
            background: #17a2b8;
            color: white;
        }
        
        .laps-container {
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
            padding-top: 15px;
        }
        
        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            font-size: 0.9rem;
        }
        
        .lap-number {
            color: #667eea;
            font-weight: 600;
        }
        
        .lap-time {
            font-family: 'Courier New', monospace;
            color: #333;
        }
        
        .lap-diff {
            font-family: 'Courier New', monospace;
            color: #666;
            font-size: 0.8rem;
        }
        
        .stopwatch-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .stopwatch-title {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .stopwatch-subtitle {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="stopwatch-container">
        <div class="stopwatch-header">
            <h1 class="stopwatch-title">⏱️ Stopwatch</h1>
            <p class="stopwatch-subtitle">Track your time with precision</p>
        </div>
        
        <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
        
        <div class="stopwatch-controls">
            <button id="startStop" class="btn-stopwatch btn-start">Start</button>
            <button id="lap" class="btn-stopwatch btn-lap" disabled>Lap</button>
            <button id="reset" class="btn-stopwatch btn-reset">Reset</button>
        </div>
        
        <div class="laps-container" id="lapsContainer" style="display: none;">
            <h3 style="margin-bottom: 10px; color: #667eea;">Lap Times</h3>
            <div id="lapsList"></div>
        </div>
    </div>
    
    <script src="stopwatch.js"></script>
</body>
</html>
