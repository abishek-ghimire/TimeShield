<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield — Flip Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="flip-clock.css">
</head>

<body>
    <div class="page-wrapper">
        <div class="brand-label">TimeShield</div>

        <div class="flip-clock">
            <!-- Hours -->
            <div class="flip-group">
                <div class="flip-card" id="card-hours">
                    <div class="card-half upper-half">
                        <div class="digit" id="upper-hours">00</div>
                    </div>
                    <div class="card-half lower-half">
                        <div class="digit" id="lower-hours">00</div>
                    </div>
                    <!-- Animated overlay -->
                    <div class="fold" id="fold-hours">
                        <div class="fold-panel fold-upper-panel">
                            <div class="digit" id="fold-upper-digit-hours">00</div>
                        </div>
                        <div class="fold-panel fold-lower-panel">
                            <div class="digit" id="fold-lower-digit-hours">00</div>
                        </div>
                    </div>
                </div>
                <div class="unit-label">Hours</div>
            </div>

            <div class="separator">
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- Minutes -->
            <div class="flip-group">
                <div class="flip-card" id="card-minutes">
                    <div class="card-half upper-half">
                        <div class="digit" id="upper-minutes">00</div>
                    </div>
                    <div class="card-half lower-half">
                        <div class="digit" id="lower-minutes">00</div>
                    </div>
                    <div class="fold" id="fold-minutes">
                        <div class="fold-panel fold-upper-panel">
                            <div class="digit" id="fold-upper-digit-minutes">00</div>
                        </div>
                        <div class="fold-panel fold-lower-panel">
                            <div class="digit" id="fold-lower-digit-minutes">00</div>
                        </div>
                    </div>
                </div>
                <div class="unit-label">Minutes</div>
            </div>

            <div class="separator">
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- Seconds (no flip) -->
            <div class="flip-group">
                <div class="seconds-card">
                    <div class="seconds-value" id="seconds-display">00</div>
                </div>
                <div class="unit-label">Seconds</div>
            </div>
        </div>

        <div class="date-display" id="date-display">Loading...</div>

        <button id="clock-view-toggle" class="view-toggle" type="button" title="Open Clock View"
            aria-label="Open Clock View">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 2.1l-4 4 4 4" />
                <path d="M21 12.6V10a4 4 0 0 0-4-4H3" />
                <path d="M17 21.9l4-4-4-4" />
                <path d="M3 11.4V14a4 4 0 0 0 4 4h14" />
            </svg>
        </button>

        <!-- Focus Timer Integration -->
        <div class="focus-timer-container" id="focusTimerContainer" style="display: none;">
            <div class="focus-timer-merged">
                <div class="focus-timer-icon">🎯</div>
                <div class="focus-timer-text" id="focusTimerText">Focus: 25:00</div>
                <button class="focus-timer-close" id="focusTimerClose">×</button>
            </div>
        </div>
    </div>

    <script src="flip-clock.js"></script>
</body>

</html>
