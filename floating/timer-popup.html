<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield Timer</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #0f172a, #1e1b4b);
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
        }

        .card {
            width: min(320px, calc(100vw - 24px));
            padding: 18px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.25);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 36px rgba(2, 6, 23, 0.45);
        }

        .title {
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 10px;
            color: #c4b5fd;
        }

        .time {
            font-size: 3rem;
            font-family: Outfit, Inter, sans-serif;
            text-align: center;
            margin: 16px 0;
            color: #f8fafc;
        }

        .inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        input {
            width: 84px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        #startStop {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
        }

        #closeWindow {
            background: rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="title">⏱️ Dedicated Timer</div>
        <div class="time" id="timerDisplay">25:00</div>
        <div class="inputs">
            <input type="number" id="timerMinutes" min="0" max="180" value="25">
            <input type="number" id="timerSeconds" min="0" max="59" value="0">
        </div>
        <div class="actions">
            <button id="startStop">Start</button>
            <button id="closeWindow">Close</button>
        </div>
    </div>
    <script src="timer-popup.js"></script>
</body>

</html>
