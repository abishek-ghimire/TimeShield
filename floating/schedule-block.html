<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield - Scheduled Blocking</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            /* Emerald/Green for Scheduled */
            --accent: #3b82f6;
            --slate-50: #f8fafc;
            --slate-400: #94a3b8;
            --slate-900: #0f172a;
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--slate-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .glass-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to bottom right, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .message {
            font-size: 1.25rem;
            color: var(--slate-400);
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .status-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .time-info {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }

        .stats-banner {
            display: flex;
            justify-content: center;
            gap: 48px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .stat-group {
            text-align: center;
        }

        .stat-val {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--slate-400);
            margin-top: 4px;
        }

        .quote-box {
            margin-top: 40px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--slate-400);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        /* New styles for countdown */
        .countdown-section {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
        }

        .countdown-label {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--slate-50);
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        .countdown-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-digits {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary);
        }

        .countdown-unit-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--slate-400);
            margin-top: 4px;
        }

        .countdown-sep {
            font-size: 3rem;
            font-weight: 700;
            color: var(--slate-400);
        }

        .footer-note {
            font-size: 0.9rem;
            color: var(--slate-400);
            margin-top: 30px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <div class="brand-badge">🔐 Scheduled Blocking Active</div>
        <h1>Focus Restricted</h1>
        <p class="message" id="professionalMessage">This site is restricted until your scheduled focus window concludes.
        </p>

        <div class="quote-box" id="motivationalQuote">
            "Discipline is the bridge between goals and accomplishment." — Jim Rohn
        </div>

        <p class="footer-note">This site will become available automatically once the schedule ends.</p>
    </div>

    <script>
        class ScheduleBlockPage {
            constructor() {
                this.quotes = [
                    "Your focus determines your reality. — Qui-Gon Jinn",
                    "The successful warrior is the average man, with laser-like focus. — Bruce Lee",
                    "Deep work is the superpower of the 21st century. — Cal Newport",
                    "Focus is more important than intelligence. — Unknown",
                    "What you focus on expands. — Tony Robbins",
                    "Focus on being productive instead of busy. — Tim Ferriss",
                    "Discipline is the bridge between goals and accomplishment. — Jim Rohn",
                    "Starve your distractions, feed your focus. — Unknown",
                    "It is during our darkest moments that we must focus to see the light. — Aristotle",
                    "Success is the product of daily habits—not once-in-a-lifetime transformations. — James Clear",
                    "Concentrate all your thoughts upon the work at hand. The sun's rays do not burn until brought to a focus. — Alexander Graham Bell",
                    "The key to success is to focus on goals, not obstacles. — Unknown",
                    "Focus is a matter of deciding what things you're not going to do. — John Carmack",
                    "Lack of direction, not lack of time, is the problem. We all have twenty-four hour days. — Zig Ziglar",
                    "Successful people have focus. They don't get sidetracked by what's not important. — Unknown",
                    "Your life is controlled by what you focus on. — Tony Robbins",
                    "The secret of change is to focus all of your energy, not on fighting the old, but on building the new. — Socrates",
                    "Don't decrease the goal. Increase the effort. — Unknown",
                    "Focus like a laser, not a flashlight. — Unknown",
                    "Simplicity is the ultimate sophistication, and focus is the key to simplicity. — Unknown",
                    "Where focus goes, energy flows. — Tony Robbins",
                    "Great things are done by a series of small things brought together. — Vincent Van Gogh"
                ];
                this.init();
            }

            async init() {
                await this.incrementBlocked();
                this.startQuoteRotation();
            }

            async incrementBlocked() {
                // Increment blocked count via background
                try {
                    await chrome.runtime.sendMessage({ action: 'incrementBlockedAttempts' });
                } catch (e) {
                    console.warn('Failed to increment stats:', e);
                }
            }

            startQuoteRotation() {
                const el = document.getElementById('motivationalQuote');
                el.textContent = `"${this.quotes[Math.floor(Math.random() * this.quotes.length)]}"`;

                setInterval(() => {
                    el.style.opacity = 0;
                    setTimeout(() => {
                        el.textContent = `"${this.quotes[Math.floor(Math.random() * this.quotes.length)]}"`;
                        el.style.opacity = 0.6;
                    }, 500);
                }, 15000);
            }
        }

        new ScheduleBlockPage();
    </script>
</body>

</html>
