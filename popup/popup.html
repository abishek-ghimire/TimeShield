<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShield</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="brand">
                <h1><span class="brand-logo-wrap"><img src="../assets/icons/icon128.png" alt="TimeShield"
                            class="brand-logo"></span> TimeShield</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="toggleFormat" class="btn-mini">12H</button>
                <div class="current-time" id="currentTime">00:00:00</div>
            </div>
        </header>

        <main class="popup-main">
            <div class="quick-actions-modern" aria-label="Quick actions">
                <button id="toggleClock" class="btn btn-primary" title="Open Clock View">
                    <span class="icon">🕐</span> <span id="clockViewLabel">Open Clock View</span>
                </button>
                <button id="startFocus" class="btn btn-focus">
                    <span class="icon">🎯</span> Focus Mode
                </button>
                <button id="openSettings" class="btn btn-secondary">
                    <span class="icon">⚙️</span> Settings
                </button>
                <button id="restoreFocusBtn" class="btn-tiny-restore" title="Restore Focus Overlay"
                    style="display:none;">✨</button>
            </div>

            <div class="popup-utility-row">
                <label class="compact-toggle">
                    <span>🎯 Focus overlay</span>
                    <span class="switch">
                        <input type="checkbox" id="focusTimerWidgetToggle">
                        <span class="slider round"></span>
                    </span>
                </label>
                <button id="flipClockMode" class="btn btn-secondary compact-action">
                    <span class="icon">🌀</span> Flip Clock
                </button>
                <button id="pauseProtectionMode" class="btn btn-secondary compact-action pause-btn">
                    <span class="icon" id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause Blocks</span>
                </button>
                <button id="addCurrentSite" class="btn btn-secondary compact-action" title="Add the currently open website to the Focus list">
                    <span class="icon">➕</span> Add Current Site
                </button>
            </div>

            <section class="card site-limits-card compact-card" aria-labelledby="siteLimitsTitle">
                <div class="card-title" id="siteLimitsTitle">
                    <span class="icon">⏳</span> Site Limits
                </div>
                <div id="siteLimitStatus" class="site-limit-status" aria-live="polite"></div>
            </section>

            <div class="popup-card-grid">
                <section class="card todo-card compact-card">
                    <div class="card-title">
                        <span class="icon">📋</span> Mission
                    </div>
                    <div class="todo-list" id="todoList">
                        <!-- Dynamic mission items -->
                    </div>
                    <button id="addTask" class="btn btn-secondary compact-card-button">
                        + New objective
                    </button>
                </section>

                <!-- Ad Blocker Mini Dashboard -->
                <section class="card adblock-card compact-card">
                <div class="card-title">
                    <span class="icon">🛡️</span> Ad Protection
                </div>
                <div class="ad-controls" style="display: flex; flex-direction: column; gap: 8px;">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 6px;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">Enhanced
                            Protection</span>
                        <label class="switch">
                            <input type="checkbox" id="adBlockToggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button id="blockElement" class="btn btn-secondary"
                            style="flex: 1; padding: 8px; font-size: 0.75rem;">
                            Select Element
                        </button>
                        <button id="updateFilters" class="btn btn-secondary"
                            style="flex: 1; padding: 8px; font-size: 0.75rem;">
                            Sync Lists
                        </button>
                    </div>
                </div>
                </section>
            </div>

            <section class="card nuclear-card compact-card" id="nuclearCard" aria-labelledby="nuclearTitle">
                <div class="card-title" id="nuclearTitle">
                    <span class="icon">☢️</span> Nuclear Mode
                    <span id="nuclearModeStatus" class="nuclear-mode-status">inactive</span>
                </div>
                <button id="nuclearExpand" class="btn btn-nuclear nuclear-expand" type="button"
                    aria-controls="nuclearSetup" aria-expanded="false">Open Nuclear Mode</button>
                <div id="nuclearSetup" hidden>
                    <div class="nuclear-duration-row">
                        <label>Hours <input type="number" id="nuclearHours" min="0" max="99" value="0"></label>
                        <label>Minutes <input type="number" id="nuclearMinutes" min="0" max="59" value="25"></label>
                    </div>
                    <p class="nuclear-settings-note">Allowed sites are managed in Settings.</p>
                    <button id="nuclearToggle" class="btn btn-nuclear" type="button">Activate Nuclear Mode</button>
                </div>
                <div id="nuclearActiveView" hidden>
                    <div id="nuclearCountdown" class="nuclear-countdown" aria-live="polite"></div>
                    <button id="nuclearStop" class="btn btn-secondary" type="button">Stop Nuclear Mode</button>
                </div>
            </section>

            <!-- Precision Timer -->
            <section class="card timer-card">
                <div class="card-title">
                    <span class="icon">⏱️</span> Timer
                </div>
                <div class="timer-ui">
                    <div class="timer-main-display" id="timerDisplay"
                        style="display:none; font-size: 2.2rem; font-weight:700;">25:00</div>
                    <div class="timer-inputs" id="timerInputsContainer">
                        <input type="number" id="timerMinutes" placeholder="Min" min="0" max="120" value="25">
                        <span style="font-weight: 700; color: var(--text-muted);">:</span>
                        <input type="number" id="timerSeconds" placeholder="Sec" min="0" max="59" value="0">
                    </div>

                    <div
                        style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 8px; padding: 4px 8px; background: rgba(255,255,255,0.02); border-radius: 6px;">
                        <span style="font-size: 0.7rem; color: var(--text-muted);">Floating Display</span>
                        <label class="switch" style="transform: scale(0.85);">
                            <input type="checkbox" id="timerWidgetToggle">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div style="display: flex; gap: 8px; width: 100%;">
                        <button id="startTimer" class="btn btn-primary" style="flex: 1;">Start Flow</button>
                        <button id="restoreTimerBtn" class="btn-tiny-restore" title="Restore Timer Overlay"
                            style="display:none;">✨</button>
                    </div>
                </div>
            </section>


        </main>
    </div>

    <script src="popup.js"></script>
</body>

</html>
