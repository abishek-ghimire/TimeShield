name: Track repository traffic

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect GitHub traffic metrics
        env:
          REPO_TRAFFIC_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/collect-repository-traffic.mjs

      - name: Commit updated traffic snapshots
        run: |
          if git diff --quiet -- data/repository-traffic.json data/repository-traffic-badge.json README.md; then
            echo "No repository traffic changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repository-traffic.json data/repository-traffic-badge.json README.md
          git commit -m "Update repository traffic snapshot"
          git push
